title: Éditions Coquerelle
description: >-
  Maison d'édition — livres et histoires.
lang: fr

# Lien de vente Amazon du livre Tortok (fiche produit, adresse directe).
lien_amazon_tortok: "https://www.amazon.ca/dp/2982553309"

plugins:
  - jekyll-sitemap   # génère /sitemap.xml (plugin supporté nativement par GitHub Pages)
  - jekyll-seo-tag   # balises de partage (Open Graph, Twitter), meta description, URL canonique

# Balises de partage : langue et image par défaut (une page peut la remplacer avec « image: » dans son front matter)
locale: fr_CA
defaults:
  - scope:
      path: ""
    values:
      image: /images/bourtouk-couleur.png

collections:
  extraits:
    output: false   # pas de page par extrait : ils sont affichés dans la page Extraits gratuits

exclude:
  - CLAUDE.md
  - SITEMAP.md
  - informations-a-completer.md
  - _livres/GABARIT.md
  - _histoires/GABARIT.md
  - _extraits/GABARIT.md
