resume: |-
  Un dude de Laval se retrouve piégé dans un cauchemar éveillé aux allures de jeu vidéo. Comme si ça ne suffisait pas, son côlon irritable et ses dettes l'ont suivi. Le chien qu'il gardait aussi. Au moins le chien s'est mis à parler. Ça fait quelqu'un avec qui jaser.

  Tortok est un roman volontairement excessif.
  Dessin animé. Grotesque. Violent.

  L'énergie d'un album punk
  La subtilité d'une toune de death métal.
